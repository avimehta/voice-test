<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Test</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e4de;--accent:#2f5d50;--accent-ink:#fff;--warn:#a1461a;--chip:#f0f0ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1f1d;--ink:#ecece6;--muted:#a3a39b;--line:#33332f;--accent:#7fbfa9;--accent-ink:#10201b;--warn:#e59a6f;--chip:#2a2a27}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1f1d;--ink:#ecece6;--muted:#a3a39b;--line:#33332f;--accent:#7fbfa9;--accent-ink:#10201b;--warn:#e59a6f;--chip:#2a2a27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--line);margin-bottom:16px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{color:var(--muted);font-size:13px;margin-left:auto}
details.sample{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
details.sample p{margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.rated{border-color:var(--accent)}
.label{display:flex;align-items:baseline;gap:10px}
.label b{font-size:28px;line-height:1}
.who{font-size:13px;color:var(--muted)}
.who strong{color:var(--ink);font-weight:600}
audio{width:100%}
.stars{display:flex;gap:6px}
.stars button{width:40px;padding:6px 0}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flag{display:flex;gap:8px;align-items:center;font-size:14px}
.comments{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.note{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.facts{font-size:12px;color:var(--muted)}
h2{font-size:17px;margin:28px 0 8px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.err{color:var(--warn)}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Voice Test</h1>
  <p class="sub">A blind listening test. Listen to each clip, rate it 1–5, flag any mispronunciations, jot down notes, then press Reveal.</p>
  <div class="bar">
    <button id="reveal" class="primary">Reveal voices</button>
    <button id="shuffle">Reshuffle</button>
    <button id="copy">Copy results</button>
    <button id="clear">Clear ratings</button>
    <span class="status" id="status"></span>
  </div>
  <details class="sample"><summary>Sample text</summary><p id="sample"></p><p class="small" id="style"></p></details>
  <div class="grid" id="grid"></div>
  <h2>Speed and cost</h2>
  <p class="small" id="tablenote"></p>
  <div class="tablewrap"><table id="table"></table></div>
  <div id="failed"></div>
  <h2>How voices were picked</h2>
  <div class="small" id="picks"></div>
  <p class="small" id="built"></p>
</main>

      '<div class="label"><b>' + letter(i) + '</b><span class="who ' + (S.revealed ? "" : "hidden") + '"><strong>' + esc(c.modelName) + '</strong><br>' + esc(c.voiceName) + (c.voiceDesc ? " · " + esc(c.voiceDesc) : "") + '</span></div>' +
      '<audio controls preload="none" src="' + c.src + '"></audio>' +
      '<div class="stars" role="group" aria-label="Rating for clip ' + letter(i) + '">' + [1,2,3,4,5].map(n => '<button data-n="' + n + '" aria-pressed="' + (r.rating === n) + '">' + n + '</button>').join("") + '</div>' +
      '<label class="flag"><input type="checkbox" ' + (r.pron ? "checked" : "") + '> Pronunciation problem</label>' +
      '<input class="note ' + (r.pron || r.note ? "" : "hidden") + '" placeholder="Which word? e.g. Staphylococcus, D-Day, 4.5 million" value="' + esc(r.note || "") + '">' +
      '<textarea class="comments" aria-label="Notes for clip ' + letter(i) + '" placeholder="Notes: tone, pacing, warmth, anything that stood out">' + esc(r.comments || "") + '</textarea>' +
      '<div class="facts">' + (c.durationS ? c.durationS.toFixed(1) + " s · " : "") + (S.revealed ? "first byte " + fmtS(c.ttfbMs) : "") + '</div>';
    const upd = patch => { S.ratings[id] = Object.assign({}, S.ratings[id], patch); save(); status(); };
    el.querySelectorAll(".stars button").forEach(b => b.onclick = () => {
      const n = +b.dataset.n; upd({ rating: n });
      el.querySelectorAll(".stars button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.n === n)));
      el.classList.add("rated");
    });
    const cb = el.querySelector("input[type=checkbox]"), note = el.querySelector(".note");
    cb.onchange = () => { upd({ pron: cb.checked }); note.classList.toggle("hidden", !cb.checked && !note.value); if (cb.checked) note.focus(); };
    note.oninput = () => upd({ note: note.value });
    const comments = el.querySelector(".comments");
    comments.oninput = () => upd({ comments: comments.value });
    el.querySelector("audio").addEventListener("play", e => document.querySelectorAll("audio").forEach(a => { if (a !== e.target) a.pause(); }));
    g.appendChild(el);
  });
}

let sortKey = "label", sortDir = 1;
function renderTable(){
  const cols = [
    ["label", "Clip", c => labelOf(c.id), false],
    ...(S.revealed ? [["modelName", "Model", c => c.modelName, false], ["voiceName", "Voice", c => c.voiceName, false]] : []),
    ["ttfbMs", "First byte", c => fmtS(c.ttfbMs), true],
    ["genMs", "Generation", c => fmtS(c.genMs), true],
    ["convertMs", "To MP3", c => c.convertMs ? fmtS(c.convertMs) : "–", true],
    ["playableMs", "Playable after", c => fmtS(c.genMs == null ? null : c.genMs + c.convertMs), true],
    ["durationS", "Length", c => c.durationS ? c.durationS.toFixed(1) + " s" : "–", true],
    ["kbps", "kbps", c => c.kbps ?? "–", true],
    ["costUsd", "Cost", c => fmtUsd(c.costUsd), true],
    ...(S.revealed ? [["costNote", "Price basis", c => c.costNote, false]] : []),
    ["rating", "Your rating", c => (S.ratings[c.id] || {}).rating || "–", true],
  ];
  const val = (c, k) => k === "label" ? S.order.indexOf(c.id) : k === "rating" ? ((S.ratings[c.id] || {}).rating || 0) : k === "playableMs" ? (c.genMs ?? 1e12) + c.convertMs : (c[k] ?? 1e12);
  const rows = playable.slice().sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const t = document.getElementById("table");
  t.innerHTML = "<thead><tr>" + cols.map(([k, h, , n]) => '<th data-k="' + k + '" class="' + (n ? "num" : "") + '">' + h + (sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : "") + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map(c => "<tr>" + cols.map(([, , f, n]) => '<td class="' + (n ? "num" : "") + '">' + esc(f(c)) + "</td>").join("") + "</tr>").join("") + "</tbody>";
  t.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; renderTable(); });
  document.getElementById("tablenote").textContent = (S.revealed ? "" : "Model and voice columns appear after Reveal. ") +
    "First byte: request sent → first audio byte. Generation: → last byte. To MP3: converting raw PCM (Gemini) or re-encoding to the target bitrate. Costs are list-price estimates for this one clip. Click a header to sort.";
  const f = document.getElementById("failed");
  f.innerHTML = failed.length ? "<h2>Not generated</h2>" + failed.map(c => '<p class="small err">' + esc(c.modelName) + " · " + esc(c.voiceName) + ": " + esc(c.error || "") + "</p>").join("") : "";
}

document.getElementById("picks").innerHTML = D.picks.map(p => "<p><strong>" + esc(p.provider) + "</strong>: " + esc(p.picked.join(", ")) + " <span>(" + esc(p.source) + (p.listed ? ", " + p.listed + " voices listed" : "") + ")</span></p>").join("");

function status(){
  const n = playable.filter(c => (S.ratings[c.id] || {}).rating).length;
  document.getElementById("status").textContent = n + " / " + playable.length + " rated";
}
function render(){
  document.getElementById("reveal").textContent = S.revealed ? "Hide voices" : "Reveal voices";
  renderCards(); renderTable(); status();
}
document.getElementById("reveal").onclick = () => { S.revealed = !S.revealed; save(); render(); };
document.getElementById("shuffle").onclick = () => { S.order = shuffled(); save(); render(); };
document.getElementById("clear").onclick = () => { S.ratings = {}; save(); render(); };
document.getElementById("copy").onclick = async () => {
  const out = {
    builtAt: D.builtAt, copiedAt: new Date().toISOString(), sample: D.sample,
    clips: S.order.map(id => { const c = byId[id], r = S.ratings[id] || {};
      return { label: labelOf(id), provider: c.provider, model: c.model, voice: c.voiceName, voiceId: c.voiceId,
        rating: r.rating ?? null, pronunciationFlag: !!r.pron, pronunciationNote: r.note || "", notes: r.comments || "",
        ttfbMs: c.ttfbMs, genMs: c.genMs, convertMs: c.convertMs, durationS: c.durationS, costUsd: c.costUsd }; })
  };
  const text = JSON.stringify(out, null, 2);
  const b = document.getElementById("copy");
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy results", 1500);
};
render();
})();
</script>
